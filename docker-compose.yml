services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hr_system
      POSTGRES_USER: hr_user
      POSTGRES_PASSWORD: hr_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_user -d hr_system"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://hr_user:hr_password@postgres:5432/hr_system?sslmode=disable
      - up
    restart: "no"

  api:
    build: .
    environment:
      APP_ENV: development
      APP_TIMEZONE: Africa/Cairo
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      HTTP_ADDRESS: :8080
      DATABASE_URL: postgres://hr_user:hr_password@postgres:5432/hr_system?sslmode=disable
      JWT_SECRET: development-only-secret-change-me-1234567890
      JWT_ISSUER: hr-management-api
      ACCESS_TOKEN_TTL: 15m
      SHUTDOWN_TIMEOUT: 10s
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      bootstrap-admin:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - api

  bootstrap-admin:
    build: .
    entrypoint: ["bootstrap-admin"]
    environment:
      DATABASE_URL: postgres://hr_user:hr_password@postgres:5432/hr_system?sslmode=disable
      ADMIN_NAME: ${ADMIN_NAME:-System Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      ADMIN_DEPARTMENT: ${ADMIN_DEPARTMENT:-Administration}
      ADMIN_LEAVE_DAYS: ${ADMIN_LEAVE_DAYS:-20}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  postgres_data:
